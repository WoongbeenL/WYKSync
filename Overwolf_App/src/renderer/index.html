<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WYKSync</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: #e94560;
    }

    .subtitle {
      color: #888;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .status-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .status-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .status-value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status-value.connected { color: #4ade80; }
    .status-value.waiting { color: #fbbf24; }
    .status-value.error { color: #ef4444; }

    .websocket-url {
      background: rgba(233, 69, 96, 0.15);
      border: 1px solid rgba(233, 69, 96, 0.3);
      border-radius: 6px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 0.95rem;
      color: #e94560;
      text-align: center;
    }

    .section-title {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 16px 0 8px 0;
    }

    .log-area {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      padding: 10px;
      height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      color: #aaa;
    }

    .log-entry {
      margin-bottom: 4px;
      word-break: break-all;
    }

    .log-entry .time {
      color: #666;
      margin-right: 8px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .hint {
      margin-top: 16px;
      text-align: center;
      font-size: 0.7rem;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">WYKSync</div>
    <div class="subtitle">Valorant Game Data Provider</div>
  </div>

  <div class="status-card">
    <div class="status-label">Status</div>
    <div class="status-value waiting" id="status">Initializing...</div>
  </div>

  <div class="status-card">
    <div class="status-label">Overlay WebSocket URL</div>
    <div class="websocket-url">ws://localhost:8765</div>
  </div>

  <div class="section-title">Debug Log</div>
  <div class="log-area" id="log"></div>

  <div class="buttons">
    <button class="btn" id="btn-info">Get Info</button>
    <button class="btn" id="btn-features">Set Features</button>
    <button class="btn" id="btn-clear">Clear Log</button>
  </div>

  <div class="hint">
    Connect your OBS browser source to the WebSocket URL above.<br>
    Team names, logos, and tournament info come from your website API.
  </div>

  <script src="renderer.js"></script>
</body>
</html>

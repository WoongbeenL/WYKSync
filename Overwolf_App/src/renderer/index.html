<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WYKSync</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0a0f1a 0%, #111827 100%);
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: #C9A84C;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #888;
      font-size: 0.75rem;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .card-gold {
      border-color: rgba(201, 168, 76, 0.3);
    }

    .card-title {
      font-size: 0.6rem;
      font-weight: 700;
      color: #C9A84C;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(201, 168, 76, 0.2);
    }

    .status-label {
      font-size: 0.6rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .status-value {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .status-value.connected {
      color: #4ade80;
    }

    .status-value.waiting {
      color: #fbbf24;
    }

    .status-value.error {
      color: #ef4444;
    }

    .websocket-url {
      background: rgba(201, 168, 76, 0.08);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #C9A84C;
      text-align: center;
    }

    /* Settings form */
    .teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .team-block-title {
      font-size: 0.55rem;
      font-weight: 700;
      color: #C9A84C;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 7px;
    }

    .field label {
      display: block;
      font-size: 0.5rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #fff;
      font-size: 0.72rem;
      padding: 5px 8px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      outline: none;
    }

    .field input:focus {
      border-color: #C9A84C;
    }

    .field input::placeholder {
      color: #444;
    }

    .apply-btn {
      width: 100%;
      margin-top: 6px;
      background: #C9A84C;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 9px 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .apply-btn:hover {
      background: #E2CA7A;
    }

    .reset-btn {
      width: 100%;
      margin-top: 6px;
      background: transparent;
      color: #555;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font-size: 0.65rem;
      padding: 6px;
      cursor: pointer;
    }

    .reset-btn:hover {
      color: #aaa;
    }

    .confirm-msg {
      font-size: 0.6rem;
      color: #4ade80;
      text-align: center;
      margin-top: 8px;
      min-height: 16px;
    }

    /* Series Map Pool */
    .format-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .format-label {
      font-size: 0.55rem;
      font-weight: 700;
      color: #C9A84C;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .format-select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 4px;
      color: #fff;
      font-size: 0.72rem;
      padding: 5px 10px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      outline: none;
      cursor: pointer;
    }

    .format-select:focus {
      border-color: #C9A84C;
    }

    .format-select option {
      background: #111827;
    }

    .series-grid {
      display: flex;
      gap: 10px;
    }

    .map-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .map-col-hidden {
      display: none !important;
    }

    .map-col-title {
      font-size: 0.55rem;
      font-weight: 700;
      color: #C9A84C;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: center;
    }

    .map-col select {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #fff;
      font-size: 0.68rem;
      padding: 5px 6px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      outline: none;
      cursor: pointer;
    }

    .map-col select:focus {
      border-color: #C9A84C;
    }

    .map-col select option {
      background: #111827;
    }

    .score-row {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: center;
    }

    .score-row input[type="number"] {
      width: 36px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #fff;
      font-size: 0.72rem;
      padding: 4px 2px;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .score-row input[type="number"]::-webkit-outer-spin-button,
    .score-row input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .score-row input[type="number"]:focus {
      border-color: #C9A84C;
    }

    .score-row .score-sep {
      color: #555;
      font-size: 0.6rem;
      font-weight: 700;
    }

    .current-radio {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.5rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .current-radio input[type="radio"] {
      accent-color: #C9A84C;
      cursor: pointer;
    }

    .section-title {
      font-size: 0.6rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 10px 0 6px;
    }

    .log-area {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      padding: 8px;
      height: 90px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.65rem;
      color: #aaa;
    }

    .log-entry {
      margin-bottom: 3px;
      word-break: break-all;
    }

    .log-entry .time {
      color: #555;
      margin-right: 6px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.72rem;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Match Code Fetch */
    .match-code-row {
      display: flex;
      gap: 8px;
    }

    .match-code-row input {
      flex: 1;
    }

    .fetch-btn {
      background: #C9A84C;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 5px 14px;
      cursor: pointer;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .fetch-btn:hover {
      background: #E2CA7A;
    }

    .fetch-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .fetch-status {
      font-size: 0.6rem;
      min-height: 16px;
      margin-top: 6px;
      text-align: center;
    }

    .fetch-status.success {
      color: #4ade80;
    }

    .fetch-status.error {
      color: #ef4444;
    }

    .fetch-status.loading {
      color: #fbbf24;
    }

    .map-pool-area {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(201, 168, 76, 0.15);
    }

    .map-pool-label {
      font-size: 0.5rem;
      font-weight: 700;
      color: #C9A84C;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .map-pool-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .map-tag {
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.6rem;
      font-weight: 600;
      color: #C9A84C;
      letter-spacing: 0.5px;
    }

    .best-of-tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.6rem;
      font-weight: 600;
      color: #aaa;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">WYKSync</div>
    <div class="subtitle">Valorant Spectator HUD</div>
  </div>

  <!-- Status -->
  <div class="card">
    <div class="status-label">Status</div>
    <div class="status-value waiting" id="status">Initializing...</div>
  </div>

  <div class="card">
    <div class="status-label">Overlay WebSocket</div>
    <div class="websocket-url">ws://localhost:8765</div>
  </div>

  <!-- Match Code Fetch -->
  <div class="card card-gold">
    <div class="card-title">⚡ Match Code — Fetch from Website</div>
    <div class="field">
      <label>API Endpoint URL</label>
      <input type="text" id="api-url" placeholder="https://wyksync.onrender.com/match"
        value="https://wyksync.onrender.com/match">
    </div>
    <div class="field">
      <label>Match Code</label>
      <div class="match-code-row">
        <input type="text" id="match-code" placeholder="e.g. ABC123" maxlength="12"
          style="text-transform:uppercase; letter-spacing:2px; font-weight:700; font-size:0.9rem;">
        <button class="fetch-btn" id="btn-fetch">FETCH</button>
      </div>
    </div>
    <div class="fetch-status" id="fetch-status"></div>
    <div class="map-pool-area" id="map-pool-area" style="display:none;">
      <div class="map-pool-label">MAP POOL</div>
      <div class="map-pool-list" id="map-pool-list"></div>
    </div>
  </div>

  <!-- Match Setup (Manual) -->
  <div class="card card-gold">
    <div class="card-title">⚙ Match Setup — Team Logos & Names</div>
    <div class="teams-grid">
      <div class="team-block">
        <div class="team-block-title">Team A (Left)</div>
        <div class="field">
          <label>Team Name</label>
          <input type="text" id="name-a" placeholder="e.g. CONDORS">
        </div>
        <div class="field">
          <label>Logo URL / Path</label>
          <input type="text" id="logo-a" placeholder="assets/logos/condors.png">
        </div>
      </div>
      <div class="team-block">
        <div class="team-block-title">Team B (Right)</div>
        <div class="field">
          <label>Team Name</label>
          <input type="text" id="name-b" placeholder="e.g. RIVALS">
        </div>
        <div class="field">
          <label>Logo URL / Path</label>
          <input type="text" id="logo-b" placeholder="assets/logos/rivals.png">
        </div>
      </div>
    </div>
    <button class="apply-btn" id="btn-apply">▶ Apply to Overlay</button>
    <button class="reset-btn" id="btn-reset">Reset</button>
    <div class="confirm-msg" id="confirm-msg"></div>
  </div>

  <!-- Series Map Pool -->
  <div class="card card-gold">
    <div class="card-title">🗺 Series Map Pool</div>
    <div class="format-row">
      <label class="format-label">Format</label>
      <select id="bo-format" class="format-select">
        <option value="1">Best of 1</option>
        <option value="3" selected>Best of 3</option>
        <option value="5">Best of 5</option>
      </select>
    </div>
    <div class="series-grid" id="series-grid">
      <div class="map-col" id="map-col-1">
        <div class="map-col-title">Map 1</div>
        <select id="map-1">
          <option value="">— Select —</option>
          <option value="Ascent">Ascent</option>
          <option value="Bind">Bind</option>
          <option value="Breeze">Breeze</option>
          <option value="Fracture">Fracture</option>
          <option value="Haven">Haven</option>
          <option value="Icebox">Icebox</option>
          <option value="Lotus">Lotus</option>
          <option value="Pearl">Pearl</option>
          <option value="Split">Split</option>
          <option value="Sunset">Sunset</option>
          <option value="Abyss">Abyss</option>
        </select>
        <div class="score-row">
          <input type="number" id="map-1-score-a" min="0" max="13" value="0">
          <span class="score-sep">vs</span>
          <input type="number" id="map-1-score-b" min="0" max="13" value="0">
        </div>
        <label class="current-radio">
          <input type="radio" name="current-map" id="map-1-current" value="1"> Current
        </label>
      </div>
      <div class="map-col" id="map-col-2">
        <div class="map-col-title">Map 2</div>
        <select id="map-2">
          <option value="">— Select —</option>
          <option value="Ascent">Ascent</option>
          <option value="Bind">Bind</option>
          <option value="Breeze">Breeze</option>
          <option value="Fracture">Fracture</option>
          <option value="Haven">Haven</option>
          <option value="Icebox">Icebox</option>
          <option value="Lotus">Lotus</option>
          <option value="Pearl">Pearl</option>
          <option value="Split">Split</option>
          <option value="Sunset">Sunset</option>
          <option value="Abyss">Abyss</option>
        </select>
        <div class="score-row">
          <input type="number" id="map-2-score-a" min="0" max="13" value="0">
          <span class="score-sep">vs</span>
          <input type="number" id="map-2-score-b" min="0" max="13" value="0">
        </div>
        <label class="current-radio">
          <input type="radio" name="current-map" id="map-2-current" value="2"> Current
        </label>
      </div>
      <div class="map-col" id="map-col-3">
        <div class="map-col-title">Map 3</div>
        <select id="map-3">
          <option value="">— Select —</option>
          <option value="Ascent">Ascent</option>
          <option value="Bind">Bind</option>
          <option value="Breeze">Breeze</option>
          <option value="Fracture">Fracture</option>
          <option value="Haven">Haven</option>
          <option value="Icebox">Icebox</option>
          <option value="Lotus">Lotus</option>
          <option value="Pearl">Pearl</option>
          <option value="Split">Split</option>
          <option value="Sunset">Sunset</option>
          <option value="Abyss">Abyss</option>
        </select>
        <div class="score-row">
          <input type="number" id="map-3-score-a" min="0" max="13" value="0">
          <span class="score-sep">vs</span>
          <input type="number" id="map-3-score-b" min="0" max="13" value="0">
        </div>
        <label class="current-radio">
          <input type="radio" name="current-map" id="map-3-current" value="3"> Current
        </label>
      </div>
      <div class="map-col map-col-hidden" id="map-col-4">
        <div class="map-col-title">Map 4</div>
        <select id="map-4">
          <option value="">— Select —</option>
          <option value="Ascent">Ascent</option>
          <option value="Bind">Bind</option>
          <option value="Breeze">Breeze</option>
          <option value="Fracture">Fracture</option>
          <option value="Haven">Haven</option>
          <option value="Icebox">Icebox</option>
          <option value="Lotus">Lotus</option>
          <option value="Pearl">Pearl</option>
          <option value="Split">Split</option>
          <option value="Sunset">Sunset</option>
          <option value="Abyss">Abyss</option>
        </select>
        <div class="score-row">
          <input type="number" id="map-4-score-a" min="0" max="13" value="0">
          <span class="score-sep">vs</span>
          <input type="number" id="map-4-score-b" min="0" max="13" value="0">
        </div>
        <label class="current-radio">
          <input type="radio" name="current-map" id="map-4-current" value="4"> Current
        </label>
      </div>
      <div class="map-col map-col-hidden" id="map-col-5">
        <div class="map-col-title">Map 5</div>
        <select id="map-5">
          <option value="">— Select —</option>
          <option value="Ascent">Ascent</option>
          <option value="Bind">Bind</option>
          <option value="Breeze">Breeze</option>
          <option value="Fracture">Fracture</option>
          <option value="Haven">Haven</option>
          <option value="Icebox">Icebox</option>
          <option value="Lotus">Lotus</option>
          <option value="Pearl">Pearl</option>
          <option value="Split">Split</option>
          <option value="Sunset">Sunset</option>
          <option value="Abyss">Abyss</option>
        </select>
        <div class="score-row">
          <input type="number" id="map-5-score-a" min="0" max="13" value="0">
          <span class="score-sep">vs</span>
          <input type="number" id="map-5-score-b" min="0" max="13" value="0">
        </div>
        <label class="current-radio">
          <input type="radio" name="current-map" id="map-5-current" value="5"> Current
        </label>
      </div>
    </div>
  </div>

  <!-- Debug log -->
  <div class="section-title">Debug Log</div>
  <div class="log-area" id="log"></div>

  <div class="buttons">
    <button class="btn" id="btn-info">Get Info</button>
    <button class="btn" id="btn-features">Set Features</button>
    <button class="btn" id="btn-clear">Clear Log</button>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
